[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metagraphRF"
version = "0.2.0.dev1"
description = "readfish aligner plugin for in-process MetaGraph queries and alignment (pymetagraph)"
readme = "README.md"
authors = [
    { name="Sayan Goswami", email="sgoswami@grlab.org" }
]
requires-python = ">=3.10"
dependencies = [
    "attrs",
    # builds metagraph from source; install pymetagraph first to use a local build
    "pymetagraph @ git+https://github.com/ratschlab/metagraph.git@ak/pymetagraph-align#subdirectory=metagraph/api/python/pymetagraph",
]

[tool.setuptools.packages.find]
where = ["src"]
